# The project name keeps these containers, networks and volumes separate
# from any other compose projects running on the same machine.
name: ledgerapi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port is configurable so it does not clash with a local Postgres.
      - "${DB_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      SECRET_KEY: ${SECRET_KEY:-insecure-docker-dev-key-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the test suite against PostgreSQL:
  #   docker compose run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
    entrypoint: []
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
